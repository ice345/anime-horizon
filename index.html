<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Horizon</title>
    <meta
      name="description"
      content="Browse each anime season, keep a personal archive of what you watch, and look back on your taste."
    />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:title" content="Anime Horizon" />
    <meta
      property="og:description"
      content="Seasonal anime guide and personal anime archive in English, 日本語 and 简体中文."
    />
    <meta property="og:type" content="website" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ah-paper: #fbfaf7;
        --ah-surface: #fffefd;
        --ah-surface-blue: #f2f7fb;
        /* Text, links and filled buttons: >= 4.5:1 on paper, surface and pale-blue panels. */
        --ah-primary: #3870a9;
        --ah-primary-strong: #2f6399;
        /* The original airy sky blue, kept for decorative fills and shadows only. */
        --ah-sky-tint: #629fdc;
        --ah-primary-soft: #dceafa;
        --ah-ink: #26364d;
        --ah-muted: #5f6e83;
        /* Blush pink is decorative only; use --ah-rose for pink text or filled controls. */
        --ah-pink: #e8aeb8;
        --ah-rose: #b04a62;
        --ah-rose-strong: #943d52;
        --ah-border: rgba(91, 124, 160, 0.14);
        --ah-page-width: 1280px;
        --ah-radius-sm: 8px;
        --ah-radius-md: 14px;
        --ah-radius-lg: 20px;
        --ah-shadow-soft: 0 12px 35px rgba(59, 95, 132, 0.08);
        --ah-transition: 180ms ease;
      }
      body {
        background-color: var(--ah-paper);
        color: var(--ah-ink);
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* Noise Texture Overlay */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 40;
        opacity: 0.18;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .ah-shell {
        min-height: 100vh;
        background: var(--ah-paper);
      }

      .ah-section-label {
        color: var(--ah-primary);
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .ah-focus-ring:focus-visible,
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--ah-primary);
        outline-offset: 3px;
      }

      .ah-entry {
        animation: ahEntry 520ms ease both;
      }

      .ah-entry-delay {
        animation: ahEntry 520ms 80ms ease both;
      }

      @keyframes ahEntry {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Smooth selection */
      ::selection {
        background: var(--ah-primary-soft);
        color: var(--ah-ink);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
