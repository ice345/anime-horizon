<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Horizon</title>
    <meta
      name="description"
      content="Browse each anime season, keep a personal archive of what you watch, and look back on your taste."
    />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:title" content="Anime Horizon" />
    <meta
      property="og:description"
      content="Seasonal anime guide and personal anime archive in English, 日本語 and 简体中文."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sans for interface and captions; serif (Latin, Japanese mincho, Chinese song) for editorial display type. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&family=Outfit:wght@400;500;600&family=Shippori+Mincho:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Paper is the field; ink is the structure. Blue and rose are rare accents, never decoration. */
        --ah-paper: #f6f4ef;
        --ah-surface: #fbfaf7;
        --ah-surface-blue: #eef1f4;
        /* Bird blue: current/selected state, primary actions and the user's own marks (>= 5:1 on paper). */
        --ah-primary: #33689e;
        --ah-primary-strong: #2b5b8c;
        /* Decorative fills only (not text). */
        --ah-sky-tint: #8fb3d6;
        --ah-primary-soft: #dfe8f1;
        --ah-ink: #1d2735;
        --ah-muted: #59626f;
        /* Rose marks affection (Loved) and destructive confirmation only. --ah-pink is decorative only. */
        --ah-pink: #e3b3bd;
        --ah-rose: #a8435b;
        --ah-rose-strong: #8f3850;
        --ah-border: rgba(29, 39, 53, 0.13);
        --ah-rule: rgba(29, 39, 53, 0.72);
        --ah-page-width: 1280px;
        /* Printed images and paper edges: nearly square. */
        --ah-radius-sm: 2px;
        --ah-radius-md: 2px;
        --ah-radius-lg: 3px;
        /* Only overlays (dialogs, toasts) lift off the page. */
        --ah-shadow-soft: 0 18px 50px rgba(29, 39, 53, 0.14);
        --ah-transition: 180ms ease;
      }
      body {
        background-color: var(--ah-paper);
        color: var(--ah-ink);
        overflow-x: hidden;
        min-height: 100vh;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .ah-shell {
        min-height: 100vh;
        background: var(--ah-paper);
      }

      /* A running head: small, tracked, muted ink. */
      .ah-section-label {
        color: var(--ah-muted);
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .ah-focus-ring:focus-visible,
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--ah-primary);
        outline-offset: 3px;
      }

      .ah-entry {
        animation: ahEntry 600ms ease both;
      }

      .ah-entry-delay {
        animation: ahEntry 600ms 90ms ease both;
      }

      @keyframes ahEntry {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Smooth selection */
      ::selection {
        background: var(--ah-primary-soft);
        color: var(--ah-ink);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
