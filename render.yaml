services:
  - type: web
    name: anime-horizon
    runtime: node
    plan: free
    # NODE_ENV=production also applies during the build, where npm would skip devDependencies
    # (Vite, Tailwind, TypeScript). --include=dev keeps them for the build; prune drops them afterwards
    # so the running service only has runtime dependencies (server.mjs uses Node built-ins only).
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      # The site's own public origin(s), comma-separated, e.g. https://anime-horizon.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # v1 ships without a shared site AI: AI reflections use the visitor's own AI service or the
      # ChatGPT bridge. Do not add DEEPSEEK_API_KEY here; see docs/deployment.md before enabling.
      - key: SITE_AI_ENABLED
        value: 'false'
